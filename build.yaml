# Сборка APK на серверах GitHub. Запускается при каждом изменении в ветке main
# или вручную: вкладка Actions → Build Veil APK → Run workflow.
name: Build Veil APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Распаковка проекта, если он загружен архивом
        run: |
          if [ -f Veil-Android.zip ]; then
            unzip -q -o Veil-Android.zip
            cp -R VeilAndroid/. .
          fi
          ls

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Сборка ядра (Xray + tun2socks) через gomobile
        working-directory: core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          go get github.com/xtls/xray-core@latest
          go get github.com/xjasonlyu/tun2socks/v2@latest
          go get golang.org/x/mobile/bind@latest
          go mod tidy
          gomobile init
          gomobile bind -v -target=android/arm64,android/arm -androidapi 24 \
            -ldflags="-s -w -buildid=" -trimpath -o ../app/libs/veilcore.aar .
          ls -la ../app/libs

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Сборка APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Переименование
        run: cp app/build/outputs/apk/release/app-release.apk Veil-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Veil-APK
          path: Veil-${{ github.run_number }}.apk

      - name: Публикация в Releases (прямая ссылка на APK)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Veil ${{ github.run_number }}
          files: Veil-${{ github.run_number }}.apk
